<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>철근콘크리트공종 기성비용 온톨로지 구조 그래프</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #667085;
      --line: #d8dee8;
      --focus: #111827;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", "Noto Sans KR", Arial, sans-serif;
      letter-spacing: 0;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      padding: 14px 22px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.25;
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 10px 22px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    button,
    input {
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 13px;
    }

    button {
      padding: 0 12px;
      cursor: pointer;
    }

    button:hover { border-color: #4b5563; }

    button.active {
      border-color: #15803d;
      background: #dcfce7;
      color: #14532d;
      font-weight: 700;
    }

    input {
      width: min(340px, 100%);
      padding: 0 10px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      height: calc(100vh - 106px);
      min-height: 720px;
    }

    .graph-panel {
      position: relative;
      min-width: 0;
      overflow: hidden;
      background: #fbfcfe;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }

    svg:active { cursor: grabbing; }

    .load-error {
      display: none;
      position: absolute;
      left: 18px;
      right: 18px;
      top: 18px;
      padding: 14px 16px;
      border: 1px solid #fecaca;
      border-radius: 8px;
      background: #fef2f2;
      color: #991b1b;
      font-size: 14px;
    }

    .link {
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      opacity: 0.9;
    }

    .link-label {
      paint-order: stroke;
      stroke: #fbfcfe;
      stroke-width: 5px;
      stroke-linejoin: round;
      fill: #334155;
      font-size: 11px;
      pointer-events: none;
    }

    .node {
      cursor: pointer;
      transition: opacity 140ms ease;
    }

    .node circle {
      stroke-width: 3px;
      filter: drop-shadow(0 3px 5px rgba(15, 23, 42, 0.18));
    }

    .node text {
      text-anchor: middle;
      dominant-baseline: middle;
      fill: #111827;
      font-size: 13px;
      font-weight: 800;
      pointer-events: none;
    }

    .node.small text { font-size: 11px; }
    .node.focus circle { stroke: var(--focus); stroke-width: 4px; }
    .dim { opacity: 0.16; }

    .side {
      overflow: auto;
      background: var(--panel);
      border-left: 1px solid var(--line);
      padding: 18px;
    }

    .side h2 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .side h3 {
      margin: 18px 0 8px;
      font-size: 13px;
      color: #334155;
    }

    dl {
      margin: 0;
      display: grid;
      grid-template-columns: 86px minmax(0, 1fr);
      column-gap: 10px;
      row-gap: 10px;
      font-size: 13px;
    }

    dt {
      color: #64748b;
      font-weight: 700;
    }

    dd {
      margin: 0;
      min-width: 0;
      line-height: 1.5;
    }

    code {
      display: inline-block;
      max-width: 100%;
      overflow-wrap: anywhere;
      padding: 2px 5px;
      border-radius: 4px;
      background: #f1f5f9;
      color: #0f172a;
      font-family: "Segoe UI", "Noto Sans KR", Arial, sans-serif;
      font-size: 12px;
    }

    .note-list,
    .formula-list {
      margin: 0;
      padding-left: 16px;
    }

    .note-list li,
    .formula-list li { margin: 6px 0; }

    .detail-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .detail-table th,
    .detail-table td {
      padding: 6px 0;
      border-top: 1px solid #e5e7eb;
      vertical-align: top;
      text-align: left;
    }

    .detail-table th {
      width: 42%;
      color: #334155;
      font-weight: 800;
      padding-right: 8px;
    }

    .attribute-value {
      margin-bottom: 3px;
      color: #0f172a;
      font-weight: 800;
    }

    .calc-flow {
      display: grid;
      gap: 8px;
      margin: 0;
    }

    .calc-card {
      padding: 10px;
      border: 1px solid #dbe4f0;
      border-radius: 8px;
      background: #f8fafc;
    }

    .calc-title {
      margin-bottom: 8px;
      font-weight: 800;
      color: #1f2937;
    }

    .calc-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .calc-token {
      padding: 5px 7px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #fff;
      font-size: 12px;
      font-weight: 700;
      color: #0f172a;
    }

    .calc-token.output {
      border-color: #2563eb;
      background: #dbeafe;
      color: #1e3a8a;
    }

    .calc-op {
      color: #64748b;
      font-weight: 800;
    }

    .calc-note {
      margin-top: 7px;
      color: #64748b;
      font-size: 12px;
      line-height: 1.45;
    }

    .legend {
      display: grid;
      gap: 8px;
      margin-top: 8px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #334155;
    }

    .swatch {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid currentColor;
      flex: 0 0 auto;
    }

    @media (max-width: 980px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .meta {
        text-align: left;
        white-space: normal;
      }

      .layout {
        grid-template-columns: 1fr;
        height: auto;
      }

      .graph-panel {
        height: 72vh;
        min-height: 560px;
      }

      .side {
        border-left: 0;
        border-top: 1px solid var(--line);
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>철근콘크리트공종 기성비용 온톨로지 구조 그래프</h1>
    <div class="meta">RDF/RDFS 관계 · 업무항목 중심 · 계산 계보 모델</div>
  </header>

  <div class="toolbar">
    <button type="button" data-filter="all" class="active">전체</button>
    <button type="button" data-filter="document">문서</button>
    <button type="button" data-filter="section">섹션</button>
    <button type="button" data-filter="work">공종</button>
    <button type="button" data-filter="item">항목</button>
    <button type="button" data-filter="basis">단가근거</button>
    <button type="button" data-filter="cost">원가</button>
    <button type="button" id="reset">초기화</button>
    <input id="search" type="search" placeholder="검색: 철근중량, 콘크리트 순체적, 거푸집 접촉면적, 동바리">
  </div>

  <main class="layout">
    <section class="graph-panel">
      <div class="load-error" id="load-error">D3.js를 불러오지 못했습니다. 인터넷 연결 또는 CDN 접근을 확인하세요.</div>
      <svg id="graph" role="img" aria-label="철근콘크리트공종 기성비용 온톨로지 구조 그래프"></svg>
    </section>
    <aside class="side" id="details">
      <h2>선택 노드</h2>
      <dl>
        <dt>라벨</dt>
        <dd>노드를 선택하면 RDF/RDFS 유형, 속성, 계산식, 연결관계가 표시됩니다.</dd>
      </dl>
      <h3>노드 구분</h3>
      <div class="legend" id="legend"></div>
    </aside>
  </main>

  <script>
    const width = 1900;
    const height = 1280;

    const typeMeta = {
      package: { label: "문서 패키지", fill: "#dcfce7", stroke: "#43a047", radius: 43 },
      document: { label: "문서", fill: "#fff7df", stroke: "#c77b13", radius: 35 },
      section: { label: "문서 섹션", fill: "#e0f2fe", stroke: "#0284c7", radius: 32 },
      work: { label: "공종", fill: "#ede9fe", stroke: "#7c3aed", radius: 31 },
      business: { label: "업무항목", fill: "#eef2ff", stroke: "#4f46e5", radius: 32 },
      spec: { label: "항목 규격", fill: "#f0fdf4", stroke: "#16a34a", radius: 31 },
      row: { label: "문서행", fill: "#f1f5f9", stroke: "#475569", radius: 31 },
      item: { label: "행 단위 항목", fill: "#eaf2ff", stroke: "#4f83cc", radius: 32 },
      basis: { label: "단가·표준 근거", fill: "#dff7f4", stroke: "#0f766e", radius: 30 },
      cost: { label: "원가항목", fill: "#fce7f3", stroke: "#c23073", radius: 30 },
      value: { label: "집계값", fill: "#fef3c7", stroke: "#d97706", radius: 29 }
    };

    const relationMeta = {
      hasDocument: { label: "rcpp:hasDocument", color: "#43a047", filters: ["document"] },
      hasPart: { label: "rcpp:hasPart", color: "#43a047", filters: ["document"] },
      hasSection: { label: "rcpp:hasSection", color: "#0284c7", filters: ["section"] },
      aboutWorkType: { label: "rcpp:aboutWorkType", color: "#7c3aed", filters: ["work", "section", "item"] },
      isSubWorkTypeOf: { label: "rcpp:isSubWorkTypeOf", color: "#7c3aed", filters: ["work"] },
      hasLineItem: { label: "rcpp:hasLineItem", color: "#4f83cc", filters: ["item"] },
      describesBusinessItem: { label: "rcpp:describesBusinessItem", color: "#4f46e5", filters: ["item"] },
      forBusinessItem: { label: "rcpp:forBusinessItem", color: "#4f46e5", filters: ["item"] },

      supportedBy: { label: "rcpp:supportedBy", color: "#64748b", filters: ["document"] },
      correspondsToContractItem: { label: "rcpp:correspondsToContractItem", color: "#2563eb", filters: ["item"] },
      hasQuantityBasis: { label: "rcpp:hasQuantityBasis", color: "#2563eb", filters: ["item"] },
      hasUnitPriceBasis: { label: "rcpp:hasUnitPriceBasis", color: "#0f766e", filters: ["item", "basis"] },
      aggregatedInto: { label: "rcpp:aggregatedInto", color: "#2563eb", filters: ["item"] },
      isCalculatedFrom: { label: "rcpp:isCalculatedFrom", color: "#d97706", filters: ["cost", "item"] },
      computedBy: { label: "rcpp:computedBy", color: "#9333ea", filters: ["cost"] },
      hasBaseAmount: { label: "rcpp:hasBaseAmount", color: "#9333ea", filters: ["cost"] },
      produces: { label: "rcpp:produces", color: "#9333ea", filters: ["cost"] },
      calculatedBy: { label: "rcpp:calculatedBy", color: "#0f766e", filters: ["basis"] },
      documentedIn: { label: "rcpp:documentedIn", color: "#0f766e", filters: ["basis"] },
      usesMaterialPrice: { label: "rcpp:usesMaterialPrice", color: "#0f766e", filters: ["basis"] },
      basedOnStandard: { label: "rcpp:basedOnStandard", color: "#0f766e", filters: ["basis"] },
      basedOnMarketRate: { label: "rcpp:basedOnMarketRate", color: "#0f766e", filters: ["basis"] },
      hasCostItem: { label: "rcpp:hasCostItem", color: "#c23073", filters: ["cost"] },
      hasSubtotal: { label: "rcpp:hasSubtotal", color: "#d97706", filters: ["cost"] },
      hasTaxAmount: { label: "rcpp:hasTaxAmount", color: "#d97706", filters: ["cost"] },
      hasTotalAmount: { label: "rcpp:hasTotalAmount", color: "#d97706", filters: ["cost"] }
    };

    const nodes = [
      { id: "package", label: "기성제출서류패키지", type: "package", group: "document", iri: "rcpp:ProgressPaymentSubmissionPackage", x: 110, y: 560, detail: "공사기성부분내역서와 비용 산정 근거서류를 함께 묶은 제출 단위." },

      { id: "statementDoc", label: "공사기성부분내역서", type: "document", group: "document", iri: "rcpp:ProgressPaymentStatement", x: 390, y: 150, detail: "최종 기성금액과 기성내역행을 표시하는 문서." },
      { id: "contractDoc", label: "계약 산출내역서", type: "document", group: "document", iri: "rcpp:ContractBOQ", x: 390, y: 290, detail: "계약 기준 항목, 규격, 단위, 계약수량, 계약단가, 계약금액을 제공하는 문서." },
      { id: "tradeDetailDoc", label: "공종별내역서", type: "document", group: "document", iri: "rcpp:TradeDetailSheet", x: 390, y: 430, detail: "공종별 기성 내역항목의 계약·전회·금회·누계·잔여 수량 및 금액을 관리하는 문서." },
      { id: "tradeSummaryDoc", label: "공종별집계표", type: "document", group: "document", iri: "rcpp:TradeSummarySheet", x: 390, y: 570, detail: "공종별내역서의 하위 항목을 공종 기준으로 집계하는 문서." },
      { id: "quantityDoc", label: "수량산출서", type: "document", group: "document", iri: "rcpp:QuantityTakeoffSheet", x: 390, y: 710, detail: "위치, 부재, 치수, 산식, 공제·할증 조건으로 기성수량을 산출하는 문서." },
      { id: "unitDoc", label: "단가근거서류패키지", type: "package", group: "document", iri: "rcpp:UnitPriceBasisPackage", x: 390, y: 850, detail: "단가산출서, 일위대가표, 소요자재단가현황을 묶는 하위 문서 패키지." },
      { id: "costDoc", label: "원가계산서", type: "document", group: "document", iri: "rcpp:CostCalculationSheet", x: 390, y: 1010, detail: "직접공사비, 간접공사비, 법정경비, 일반관리비, 이윤, 부가가치세를 계산하는 문서." },
      { id: "unitCalcDoc", label: "단가산출서", type: "document", group: "basis", iri: "rcpp:UnitPriceCalculationSheet", x: 560, y: 835, detail: "단가항목 산출식과 근거를 문서화하는 단가근거서류." },
      { id: "unitTableDoc", label: "일위대가표", type: "document", group: "basis", iri: "rcpp:UnitPriceTable", x: 560, y: 760, detail: "단가 구성요소와 일위대가 항목을 제공하는 문서." },
      { id: "materialSurveyDoc", label: "소요자재단가현황", type: "document", group: "basis", iri: "rcpp:MaterialPriceSurvey", x: 560, y: 910, detail: "자재 조사단가 또는 적용단가를 제공하는 문서." },

      { id: "progressSection", label: "기성내역섹션", type: "section", group: "section", iri: "rcpp:ProgressPaymentSection", x: 690, y: 150, detail: "공사기성부분내역서의 반복 기성내역행 구획." },
      { id: "contractSection", label: "계약내역섹션", type: "section", group: "section", iri: "rcpp:ContractBOQSection", x: 690, y: 290, detail: "계약 산출내역서의 계약 내역항목 구획." },
      { id: "tradeDetailSection", label: "공종내역섹션", type: "section", group: "section", iri: "rcpp:TradeDetailSection", x: 690, y: 430, detail: "공종별내역서 내부에서 특정 공종의 내역항목을 담는 섹션." },
      { id: "summarySection", label: "공종집계섹션", type: "section", group: "section", iri: "rcpp:TradeSummarySection", x: 690, y: 570, detail: "공종별집계표 내부에서 특정 공종의 집계항목을 담는 섹션." },
      { id: "quantitySection", label: "수량산출섹션", type: "section", group: "section", iri: "rcpp:QuantityTakeoffSection", x: 690, y: 710, detail: "수량산출서 내부에서 특정 공종의 수량산출항목을 담는 섹션." },

      { id: "costSection", label: "원가계산섹션", type: "section", group: "section", iri: "rcpp:CostCalculationSection", x: 690, y: 1010, detail: "원가계산서 내부의 원가항목 계산 구획." },

      { id: "concreteWork", label: "콘크리트공사", type: "work", group: "work", iri: "rcpp:ConcreteWork a rcpp:WorkType", x: 1190, y: 130, detail: "콘크리트 관련 공종 개념. 종류·강도·골재치수·슬럼프는 업무항목의 콘크리트 규격 노드에 둔다." },
      { id: "formwork", label: "거푸집공사", type: "work", group: "work", iri: "rcpp:Formwork a rcpp:WorkType", x: 1190, y: 200, detail: "거푸집 관련 공종 개념. 접촉면적 산식 입력값은 거푸집 수량산출항목에 둔다." },

    function initGraph() {
      const svg = d3.select("#graph").attr("viewBox", `0 0 ${width} ${height}`);
      const details = document.getElementById("details");
      const search = document.getElementById("search");
      const resetButton = document.getElementById("reset");
      const nodeById = new Map(nodes.map((node) => [node.id, node]));
      const linkData = links.map((link) => ({
        ...link,
        source: nodeById.get(link.source),
        target: nodeById.get(link.target)
      }));
      let activeFilter = "all";
      let selectedId = null;

      const root = svg.append("g");
      const linkLayer = root.append("g");
      const labelLayer = root.append("g");
      const nodeLayer = root.append("g");

      const zoom = d3.zoom()
        .scaleExtent([0.32, 2.4])
        .on("zoom", (event) => root.attr("transform", event.transform));
      svg.call(zoom);

      svg.append("defs")
        .selectAll("marker")
        .data(Object.entries(relationMeta))
        .join("marker")
        .attr("id", ([key]) => `arrow-${key}`)
        .attr("viewBox", "0 -5 10 10")
        .attr("refX", 9)
        .attr("refY", 0)
        .attr("markerWidth", 6)
        .attr("markerHeight", 6)
        .attr("orient", "auto")
        .append("path")
        .attr("d", "M0,-5L10,0L0,5")
        .attr("fill", ([, meta]) => meta.color);

      const link = linkLayer.selectAll("path")
        .data(linkData)
        .join("path")
        .attr("class", "link")
        .attr("stroke", (linkDatum) => relationMeta[linkDatum.relation].color)
        .attr("marker-end", (linkDatum) => `url(#arrow-${linkDatum.relation})`)
        .attr("d", pathForLink);

      const linkLabel = labelLayer.selectAll("text")
        .data(linkData)
        .join("text")
        .attr("class", "link-label")
        .text((linkDatum) => relationMeta[linkDatum.relation].label)
        .attr("x", (linkDatum) => labelPoint(linkDatum).x)
        .attr("y", (linkDatum) => labelPoint(linkDatum).y);

      const node = nodeLayer.selectAll("g")
        .data(nodes)
        .join("g")
        .attr("class", (nodeDatum) => `node ${typeMeta[nodeDatum.type].radius <= 31 ? "small" : ""}`)
        .attr("transform", (nodeDatum) => `translate(${nodeDatum.x},${nodeDatum.y})`)
        .call(d3.drag()
          .on("start", dragStarted)
          .on("drag", dragged));

      node.append("circle")
        .attr("r", (nodeDatum) => typeMeta[nodeDatum.type].radius)
        .attr("fill", (nodeDatum) => typeMeta[nodeDatum.type].fill)
        .attr("stroke", (nodeDatum) => typeMeta[nodeDatum.type].stroke);

      node.append("text")
        .selectAll("tspan")
        .data((nodeDatum) => wrapLabel(nodeDatum.label, 8).map((line, index, lines) => ({ line, index, lines })))
        .join("tspan")
        .attr("x", 0)
        .attr("dy", (datum) => datum.index === 0 ? `${-(datum.lines.length - 1) * 0.58}em` : "1.16em")
        .text((datum) => datum.line);

      node.on("click", (event, datum) => {
        event.stopPropagation();
        selectedId = datum.id;
        updateDetails(datum);
        applyVisibility();
      });

      svg.on("click", () => {
        selectedId = null;
        updateDetails(null);
        applyVisibility();
      });

      document.querySelectorAll("button[data-filter]").forEach((button) => {
        button.addEventListener("click", () => {
          document.querySelectorAll("button[data-filter]").forEach((item) => item.classList.remove("active"));
          button.classList.add("active");
          activeFilter = button.dataset.filter;
          applyVisibility();
        });
      });

      resetButton.addEventListener("click", () => {
        selectedId = null;
        search.value = "";
        activeFilter = "all";
        document.querySelectorAll("button[data-filter]").forEach((item) => {
          item.classList.toggle("active", item.dataset.filter === "all");
        });
        svg.transition().duration(250).call(zoom.transform, d3.zoomIdentity);
        updateDetails(null);
        applyVisibility();
      });

      search.addEventListener("input", applyVisibility);
      renderLegend();
      updateDetails(null);
      applyVisibility();

      function pathForLink(linkDatum) {
        const sourceRadius = typeMeta[linkDatum.source.type].radius + 3;
        const targetRadius = typeMeta[linkDatum.target.type].radius + 10;
        const start = edgePoint(linkDatum.source, linkDatum.target, sourceRadius);
        const end = edgePoint(linkDatum.target, linkDatum.source, targetRadius);
        const sx = start.x;
        const sy = start.y;
        const tx = end.x;
        const ty = end.y;
        const dx = tx - sx;
        const curve = Math.max(-90, Math.min(90, dx * 0.12));
        const cx = sx + dx * 0.52;
        const cy = (sy + ty) / 2 - curve;
        return `M${sx},${sy} Q${cx},${cy} ${tx},${ty}`;
      }

      function edgePoint(from, to, radius) {
        const dx = to.x - from.x;
        const dy = to.y - from.y;
        const length = Math.sqrt(dx * dx + dy * dy) || 1;
        return {
          x: from.x + (dx / length) * radius,
          y: from.y + (dy / length) * radius
        };
      }

      function labelPoint(linkDatum) {
        const sx = linkDatum.source.x;
        const sy = linkDatum.source.y;
        const tx = linkDatum.target.x;
        const ty = linkDatum.target.y;
        return {
          x: (sx + tx) / 2,
          y: (sy + ty) / 2 - 8
        };
      }

      function dragStarted(event, datum) {
        datum.x = event.x;
        datum.y = event.y;
        refreshPositions();
      }

      function dragged(event, datum) {
        datum.x = event.x;
        datum.y = event.y;
        refreshPositions();
      }

      function refreshPositions() {
        node.attr("transform", (nodeDatum) => `translate(${nodeDatum.x},${nodeDatum.y})`);
        link.attr("d", pathForLink);
        linkLabel
          .attr("x", (linkDatum) => labelPoint(linkDatum).x)
          .attr("y", (linkDatum) => labelPoint(linkDatum).y);
      }

      function applyVisibility() {
        const term = search.value.trim().toLowerCase();
        const selectedNeighbors = new Set();
        if (selectedId) {
          selectedNeighbors.add(selectedId);
          linkData.forEach((linkDatum) => {
            if (linkDatum.source.id === selectedId) selectedNeighbors.add(linkDatum.target.id);
            if (linkDatum.target.id === selectedId) selectedNeighbors.add(linkDatum.source.id);
          });
        }

        node.classed("dim", (nodeDatum) => {
          const filterDim = activeFilter !== "all" && nodeDatum.group !== activeFilter;
          const searchDim = term && !searchText(nodeDatum).includes(term);
          const selectedDim = selectedId && !selectedNeighbors.has(nodeDatum.id);
          return filterDim || searchDim || selectedDim;
        }).classed("focus", (nodeDatum) => nodeDatum.id === selectedId);

        link.classed("dim", (linkDatum) => {
          const relation = relationMeta[linkDatum.relation];
          const filterDim = activeFilter !== "all" && !relation.filters.includes(activeFilter);
          const searchDim = term && !searchText(linkDatum.source).includes(term) && !searchText(linkDatum.target).includes(term);
          const selectedDim = selectedId && linkDatum.source.id !== selectedId && linkDatum.target.id !== selectedId;
          return filterDim || searchDim || selectedDim;
        });

        linkLabel.classed("dim", (linkDatum) => {
          const relation = relationMeta[linkDatum.relation];
          const filterDim = activeFilter !== "all" && !relation.filters.includes(activeFilter);
          const searchDim = term && !searchText(linkDatum.source).includes(term) && !searchText(linkDatum.target).includes(term);
          const selectedDim = selectedId && linkDatum.source.id !== selectedId && linkDatum.target.id !== selectedId;
          return filterDim || searchDim || selectedDim;
        });
      }

      function searchText(nodeDatum) {
        return [
          nodeDatum.label,
          nodeDatum.iri,
          nodeDatum.detail || "",
          (nodeDatum.notes || []).join(" "),
          (nodeDatum.attributes || []).flat().join(" "),
          (nodeDatum.formulas || []).flat().join(" "),
          (nodeDatum.calculationFlows || []).flatMap((flow) => [flow.title, flow.output, flow.note, ...flow.inputs]).join(" "),
          typeMeta[nodeDatum.type].label
        ].join(" ").toLowerCase();
      }

      function updateDetails(datum) {
        const dl = details.querySelector("dl");
        if (!datum) {
          dl.innerHTML = `
            <dt>라벨</dt>
            <dd>노드를 선택하면 RDF/RDFS 유형, 속성, 계산식, 연결관계가 표시됩니다.</dd>
          `;
          return;
        }

        const outbound = linkData.filter((linkDatum) => linkDatum.source.id === datum.id);
        const inbound = linkData.filter((linkDatum) => linkDatum.target.id === datum.id);
        dl.innerHTML = `
          <dt>라벨</dt><dd>${datum.label}</dd>
          <dt>식별자</dt><dd><code>${datum.iri}</code></dd>
          <dt>구분</dt><dd>${typeMeta[datum.type].label}</dd>
          <dt>설명</dt><dd>${datum.detail}</dd>
          ${datum.notes ? `<dt>기준</dt><dd><ul class="note-list">${datum.notes.map((note) => `<li>${note}</li>`).join("")}</ul></dd>` : ""}
          ${datum.attributes ? `<dt>${datum.attributeLabel || "속성"}</dt><dd>${renderAttributeTable(datum.attributes)}</dd>` : ""}
          ${datum.calculationFlows ? `<dt>계산 흐름</dt><dd>${renderCalculationFlows(datum.calculationFlows)}</dd>` : ""}
          ${datum.formulas ? `<dt>계산식</dt><dd>${renderFormulaList(datum.formulas)}</dd>` : ""}
          <dt>나가는 표시 관계</dt><dd>${outbound.length ? outbound.map(formatOutboundLink).join("<br>") : "없음"}</dd>
          <dt>들어오는 표시 관계</dt><dd>${inbound.length ? inbound.map(formatInboundLink).join("<br>") : "없음"}</dd>
        `;
      }

      function renderAttributeTable(attributes) {
        return `
          <table class="detail-table">
            <tbody>
              ${attributes.map(([predicate, label, valueOrNote, note]) => `
                <tr>
                  <th><code>${predicate}</code><br>${label}</th>
                  <td>
                    ${note === undefined ? valueOrNote : `<div class="attribute-value">${valueOrNote}</div>${note}`}
                  </td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;
      }

      function renderFormulaList(formulas) {
        return `
          <ul class="formula-list">
            ${formulas.map(([name, expression, note]) => `
              <li>
                <strong>${name}</strong><br>
                <code>${expression}</code><br>
                ${note}
              </li>
            `).join("")}
          </ul>
        `;
      }

      function renderCalculationFlows(flows) {
        return `
          <div class="calc-flow">
            ${flows.map((flow) => `
              <div class="calc-card">
                <div class="calc-title">${flow.title}</div>
                <div class="calc-row">
                  ${flow.inputs.map((input, index) => `
                    <span class="calc-token">${input}</span>
                    ${flow.operators[index] ? `<span class="calc-op">${flow.operators[index]}</span>` : ""}
                  `).join("")}
                  <span class="calc-op">=</span>
                  <span class="calc-token output">${flow.output}</span>
                </div>
                <div class="calc-note">${flow.note}</div>
              </div>
            `).join("")}
          </div>
        `;
      }

      function formatOutboundLink(linkDatum) {
        return `<code>${relationMeta[linkDatum.relation].label}</code> → ${linkDatum.target.label}`;
      }

      function formatInboundLink(linkDatum) {
        return `${linkDatum.source.label} → <code>${relationMeta[linkDatum.relation].label}</code>`;
      }

      function renderLegend() {
        document.getElementById("legend").innerHTML = Object.entries(typeMeta).map(([, meta]) => `
          <div class="legend-item">
            <span class="swatch" style="background:${meta.fill}; color:${meta.stroke}"></span>
            <span>${meta.label}</span>
          </div>
        `).join("");
      }
    }

    function wrapLabel(label, max) {
      if (label.length <= max) return [label];
      const words = label.split(" ");
      if (words.length > 1) {
        const lines = [];
        let current = "";
        words.forEach((word) => {
          const next = current ? `${current} ${word}` : word;
          if (next.length > max && current) {
            lines.push(current);
            current = word;
          } else {
            current = next;
          }
        });
        if (current) lines.push(current);
        return lines.slice(0, 3);
      }
      return [
        label.slice(0, max),
        label.slice(max, max * 2),
        label.slice(max * 2, max * 3)
      ].filter(Boolean);
    }
  </script>
</body>
