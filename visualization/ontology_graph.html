<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PCPO 철근콘크리트공종 기성금액 온톨로지</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #667085;
      --line: #d8dee8;
      --focus: #111827;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", "Noto Sans KR", Arial, sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      padding: 14px 22px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.25;
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 10px 22px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    button,
    input {
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 13px;
    }

    button {
      padding: 0 12px;
      cursor: pointer;
    }

    button:hover { border-color: #4b5563; }

    button.active {
      border-color: #15803d;
      background: #dcfce7;
      color: #14532d;
      font-weight: 700;
    }

    input {
      width: min(360px, 100%);
      padding: 0 10px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 380px;
      height: calc(100vh - 106px);
      min-height: 700px;
    }

    .graph-panel {
      position: relative;
      min-width: 0;
      overflow: hidden;
      background: #fbfcfe;
    }

    .graph-note {
      position: absolute;
      z-index: 2;
      left: 14px;
      top: 12px;
      padding: 7px 9px;
      border: 1px solid #dbe4f0;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.92);
      color: #475569;
      font-size: 11px;
      pointer-events: none;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }

    svg:active { cursor: grabbing; }

    .load-error {
      display: none;
      position: absolute;
      z-index: 3;
      left: 18px;
      right: 18px;
      top: 52px;
      padding: 14px 16px;
      border: 1px solid #fecaca;
      border-radius: 8px;
      background: #fef2f2;
      color: #991b1b;
      font-size: 14px;
    }

    .link {
      fill: none;
      stroke-width: 2.1;
      stroke-linecap: round;
      opacity: 0.88;
    }

    .link-label {
      paint-order: stroke;
      stroke: #fbfcfe;
      stroke-width: 5px;
      stroke-linejoin: round;
      fill: #334155;
      font-size: 10.5px;
      text-anchor: middle;
      pointer-events: none;
    }

    .node {
      cursor: pointer;
      transition: opacity 140ms ease;
    }

    .node circle {
      stroke-width: 3px;
      filter: drop-shadow(0 3px 5px rgba(15, 23, 42, 0.16));
    }

    .node text {
      text-anchor: middle;
      dominant-baseline: middle;
      fill: #111827;
      font-size: 12px;
      font-weight: 800;
      pointer-events: none;
    }

    .node.small text { font-size: 10.5px; }
    .node.focus circle { stroke: var(--focus); stroke-width: 4px; }
    .dim { opacity: 0.12; }

    .side {
      overflow: auto;
      background: var(--panel);
      border-left: 1px solid var(--line);
      padding: 18px;
    }

    .side h2 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .side h3 {
      margin: 18px 0 8px;
      font-size: 13px;
      color: #334155;
    }

    dl {
      margin: 0;
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      column-gap: 10px;
      row-gap: 10px;
      font-size: 13px;
    }

    dt {
      color: #64748b;
      font-weight: 700;
    }

    dd {
      margin: 0;
      min-width: 0;
      line-height: 1.5;
    }

    code {
      display: inline-block;
      max-width: 100%;
      overflow-wrap: anywhere;
      padding: 2px 5px;
      border-radius: 4px;
      background: #f1f5f9;
      color: #0f172a;
      font-family: "Segoe UI", "Noto Sans KR", Arial, sans-serif;
      font-size: 12px;
    }

    .note-list,
    .formula-list {
      margin: 0;
      padding-left: 16px;
    }

    .note-list li,
    .formula-list li { margin: 6px 0; }

    .detail-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .detail-table th,
    .detail-table td {
      padding: 7px 0;
      border-top: 1px solid #e5e7eb;
      vertical-align: top;
      text-align: left;
    }

    .detail-table th {
      width: 45%;
      color: #334155;
      font-weight: 800;
      padding-right: 8px;
    }

    .attribute-value {
      margin-bottom: 3px;
      color: #0f172a;
      font-weight: 800;
    }

    .legend {
      display: grid;
      gap: 8px;
      margin-top: 8px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #334155;
    }

    .swatch {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid currentColor;
      flex: 0 0 auto;
    }

    @media (max-width: 980px) {
      header { align-items: flex-start; flex-direction: column; }
      .meta { text-align: left; white-space: normal; }
      .layout { grid-template-columns: 1fr; height: auto; }
      .graph-panel { height: 72vh; min-height: 560px; }
      .side { border-left: 0; border-top: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <header>
    <h1>PCPO 철근콘크리트공종 기성금액 온톨로지</h1>
    <div class="meta">RDF/RDFS · SPARQL 검증 · 제2회 synthetic example data</div>
  </header>

  <div class="toolbar">
    <button type="button" data-filter="all" class="active">전체</button>
    <button type="button" data-filter="contract">프로젝트·계약</button>
    <button type="button" data-filter="document">문서</button>
    <button type="button" data-filter="line">문서항목</button>
    <button type="button" data-filter="work">공종계층</button>
    <button type="button" data-filter="calculation">계산·집계</button>
    <button type="button" data-filter="support">기준정보</button>
    <button type="button" id="reset">초기화</button>
    <input id="search" type="search" placeholder="검색: 계약버전, 금회기성액, 전회 승인, 철근공사">
  </div>

  <main class="layout">
    <section class="graph-panel">
      <div class="graph-note">화살표 방향: RDF 주어 → 객체 · 상세 값은 정상 합성 예제</div>
      <div class="load-error" id="load-error">D3.js를 불러오지 못했습니다. 인터넷 연결 또는 CDN 접근을 확인하세요.</div>
      <svg id="graph" role="img" aria-label="PCPO 철근콘크리트공종 기성금액 온톨로지 구조 그래프"></svg>
    </section>
    <aside class="side" id="details">
      <h2>선택 노드</h2>
      <dl>
        <dt>안내</dt>
        <dd>노드를 선택하면 새 PCPO 클래스, 속성, 예제값, 계산식과 RDF 관계가 표시됩니다.</dd>
      </dl>
      <h3>노드 구분</h3>
      <div class="legend" id="legend"></div>
    </aside>
  </main>

  <script>

    const height = 1040;

      correspondsTo: { label: "pcpo:correspondsTo", color: "#64748b", filters: ["line"] },

    const nodes = [

      {

    function initGraph() {
      const svg = d3.select("#graph").attr("viewBox", `0 0 ${width} ${height}`);
      const details = document.getElementById("details");
      const search = document.getElementById("search");
      const resetButton = document.getElementById("reset");
      const nodeById = new Map(nodes.map((node) => [node.id, node]));
      const linkData = links.map((link) => ({
        ...link,
        source: nodeById.get(link.source),
        target: nodeById.get(link.target)
      }));
      let activeFilter = "all";
      let selectedId = null;

      const root = svg.append("g");
      const linkLayer = root.append("g");
      const labelLayer = root.append("g");
      const nodeLayer = root.append("g");

      const zoom = d3.zoom()
        .scaleExtent([0.35, 2.5])
        .on("zoom", (event) => root.attr("transform", event.transform));
      svg.call(zoom);

      svg.append("defs")
        .selectAll("marker")
        .data(Object.entries(relationMeta))
        .join("marker")
        .attr("id", ([key]) => `arrow-${key}`)
        .attr("viewBox", "0 -5 10 10")
        .attr("refX", 9)
        .attr("refY", 0)
        .attr("markerWidth", 6)
        .attr("markerHeight", 6)
        .attr("orient", "auto")
        .append("path")
        .attr("d", "M0,-5L10,0L0,5")
        .attr("fill", ([, meta]) => meta.color);

      const link = linkLayer.selectAll("path")
        .data(linkData)
        .join("path")
        .attr("class", "link")
        .attr("stroke", (datum) => relationMeta[datum.relation].color)
        .attr("marker-end", (datum) => `url(#arrow-${datum.relation})`)
        .attr("d", pathForLink);

      const linkLabel = labelLayer.selectAll("text")
        .data(linkData)
        .join("text")
        .attr("class", "link-label")
        .text((datum) => relationMeta[datum.relation].label)
        .attr("x", (datum) => labelPoint(datum).x)
        .attr("y", (datum) => labelPoint(datum).y);

      const node = nodeLayer.selectAll("g")
        .data(nodes)
        .join("g")
        .attr("class", (datum) => `node ${typeMeta[datum.type].radius <= 33 ? "small" : ""}`)
        .attr("transform", (datum) => `translate(${datum.x},${datum.y})`)
        .call(d3.drag().on("start", dragged).on("drag", dragged));

      node.append("circle")
        .attr("r", (datum) => typeMeta[datum.type].radius)
        .attr("fill", (datum) => typeMeta[datum.type].fill)
        .attr("stroke", (datum) => typeMeta[datum.type].stroke);

      node.append("text")
        .selectAll("tspan")
        .data((datum) => wrapLabel(datum.label, 9).map((line, index, lines) => ({ line, index, lines })))
        .join("tspan")
        .attr("x", 0)
        .attr("dy", (datum) => datum.index === 0 ? `${-(datum.lines.length - 1) * 0.58}em` : "1.16em")
        .text((datum) => datum.line);

      node.on("click", (event, datum) => {
        event.stopPropagation();
        selectedId = datum.id;
        updateDetails(datum);
        applyVisibility();
      });

      svg.on("click", () => {
        selectedId = null;
        updateDetails(null);
        applyVisibility();
      });

      document.querySelectorAll("button[data-filter]").forEach((button) => {
        button.addEventListener("click", () => {
          document.querySelectorAll("button[data-filter]").forEach((item) => item.classList.remove("active"));
          button.classList.add("active");
          activeFilter = button.dataset.filter;
          applyVisibility();
        });
      });

      resetButton.addEventListener("click", () => {
        selectedId = null;
        search.value = "";
        activeFilter = "all";
        document.querySelectorAll("button[data-filter]").forEach((item) => {
          item.classList.toggle("active", item.dataset.filter === "all");
        });
        svg.transition().duration(250).call(zoom.transform, d3.zoomIdentity);
        updateDetails(null);
        applyVisibility();
      });

      search.addEventListener("input", applyVisibility);
      renderLegend();
      updateDetails(null);
      applyVisibility();

      function pathForLink(datum) {
        const sourceRadius = typeMeta[datum.source.type].radius + 3;
        const targetRadius = typeMeta[datum.target.type].radius + 10;
        const start = edgePoint(datum.source, datum.target, sourceRadius);
        const end = edgePoint(datum.target, datum.source, targetRadius);
        const midpointX = (start.x + end.x) / 2;
        const midpointY = (start.y + end.y) / 2;
        const dx = end.x - start.x;
        const dy = end.y - start.y;
        const length = Math.sqrt(dx * dx + dy * dy) || 1;
        const bend = datum.bend || 0;
        const controlX = midpointX - (dy / length) * bend;
        const controlY = midpointY + (dx / length) * bend;
        return `M${start.x},${start.y} Q${controlX},${controlY} ${end.x},${end.y}`;
      }

      function edgePoint(from, to, radius) {
        const dx = to.x - from.x;
        const dy = to.y - from.y;
        const length = Math.sqrt(dx * dx + dy * dy) || 1;
        return { x: from.x + (dx / length) * radius, y: from.y + (dy / length) * radius };
      }

      function labelPoint(datum) {
        return {
          x: (datum.source.x + datum.target.x) / 2 + (datum.labelDx || 0),
          y: (datum.source.y + datum.target.y) / 2 - 7 + (datum.labelDy || 0)
        };
      }

      function dragged(event, datum) {
        datum.x = event.x;
        datum.y = event.y;
        node.attr("transform", (item) => `translate(${item.x},${item.y})`);
        link.attr("d", pathForLink);
        linkLabel.attr("x", (item) => labelPoint(item).x).attr("y", (item) => labelPoint(item).y);
      }

      function applyVisibility() {
        const term = search.value.trim().toLowerCase();
        const selectedNeighbors = new Set();
        if (selectedId) {
          selectedNeighbors.add(selectedId);
          linkData.forEach((datum) => {
            if (datum.source.id === selectedId) selectedNeighbors.add(datum.target.id);
            if (datum.target.id === selectedId) selectedNeighbors.add(datum.source.id);
          });
        }

        node.classed("dim", (datum) => {
          const filterDim = activeFilter !== "all" && datum.group !== activeFilter;
          const searchDim = term && !searchText(datum).includes(term);
          const selectedDim = selectedId && !selectedNeighbors.has(datum.id);
          return filterDim || searchDim || selectedDim;
        }).classed("focus", (datum) => datum.id === selectedId);

        link.classed("dim", linkIsDimmed);
        linkLabel.classed("dim", linkIsDimmed);

        function linkIsDimmed(datum) {
          const filterDim = activeFilter !== "all" && !relationMeta[datum.relation].filters.includes(activeFilter);
          const searchDim = term && !searchText(datum.source).includes(term) && !searchText(datum.target).includes(term);
          const selectedDim = selectedId && datum.source.id !== selectedId && datum.target.id !== selectedId;
          return filterDim || searchDim || selectedDim;
        }
      }

      function searchText(datum) {
        return [
          datum.label,
          datum.iri,
          datum.detail || "",
          (datum.notes || []).join(" "),
          (datum.attributes || []).flat().join(" "),
          (datum.formulas || []).flat().join(" "),
          typeMeta[datum.type].label
        ].join(" ").toLowerCase();
      }

      function updateDetails(datum) {
        const dl = details.querySelector("dl");
        if (!datum) {
          dl.innerHTML = `
            <dt>안내</dt>
            <dd>노드를 선택하면 새 PCPO 클래스, 속성, 정상 예제값과 RDF 관계가 표시됩니다.</dd>
            <dt>방향</dt>
            <dd><code>A pcpo:relation B</code>는 A에서 B로 향하는 화살표입니다.</dd>
            <dt>범위</dt>
            <dd>계약버전, 금회수량, 전회 승인값, 기성금액 계산과 철근·콘크리트·거푸집·동바리 집계를 표시합니다.</dd>
          `;
          return;
        }

        const outbound = linkData.filter((item) => item.source.id === datum.id);
        const inbound = linkData.filter((item) => item.target.id === datum.id);
        dl.innerHTML = `
          <dt>라벨</dt><dd>${datum.label}</dd>
          <dt>식별자</dt><dd><code>${datum.iri}</code></dd>
          <dt>구분</dt><dd>${typeMeta[datum.type].label}</dd>
          <dt>설명</dt><dd>${datum.detail}</dd>
          ${datum.notes ? `<dt>기준</dt><dd><ul class="note-list">${datum.notes.map((note) => `<li>${note}</li>`).join("")}</ul></dd>` : ""}
          ${datum.attributes ? `<dt>속성·예제</dt><dd>${renderAttributeTable(datum.attributes)}</dd>` : ""}
          ${datum.formulas ? `<dt>계산식</dt><dd>${renderFormulaList(datum.formulas)}</dd>` : ""}
          <dt>나가는 관계</dt><dd>${outbound.length ? outbound.map(formatOutboundLink).join("<br>") : "없음"}</dd>
          <dt>들어오는 관계</dt><dd>${inbound.length ? inbound.map(formatInboundLink).join("<br>") : "없음"}</dd>
        `;
      }

      function renderAttributeTable(attributes) {
        return `<table class="detail-table"><tbody>${attributes.map(([predicate, label, value, note]) => `
          <tr><th><code>${predicate}</code><br>${label}</th><td><div class="attribute-value">${value}</div>${note || ""}</td></tr>
        `).join("")}</tbody></table>`;
      }

      function renderFormulaList(formulas) {
        return `<ul class="formula-list">${formulas.map(([name, expression, note]) => `
          <li><strong>${name}</strong><br><code>${expression}</code><br>${note}</li>
        `).join("")}</ul>`;
      }

      function formatOutboundLink(datum) {
        return `<code>${relationMeta[datum.relation].label}</code> → ${datum.target.label}`;
      }

      function formatInboundLink(datum) {
        return `${datum.source.label} → <code>${relationMeta[datum.relation].label}</code>`;
      }

      function renderLegend() {
        document.getElementById("legend").innerHTML = Object.values(typeMeta).map((meta) => `
          <div class="legend-item">
            <span class="swatch" style="background:${meta.fill}; color:${meta.stroke}"></span>
            <span>${meta.label}</span>
          </div>
        `).join("");
      }
    }

    function wrapLabel(label, max) {
      if (label.length <= max) return [label];
      const words = label.split(" ");
      if (words.length > 1) {
        const lines = [];
        let current = "";
        words.forEach((word) => {
          const next = current ? `${current} ${word}` : word;
          if (next.length > max && current) {
            lines.push(current);
            current = word;
          } else {
            current = next;
          }
        });
        if (current) lines.push(current);
        return lines.slice(0, 3);
      }
      return [label.slice(0, max), label.slice(max, max * 2), label.slice(max * 2, max * 3)].filter(Boolean);
    }
  </script>
</body>
</html>
